<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synchro Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #050815;
      --surface:  #0d1530;
      --border:   #22305a;
      --border-hi:#334b82;
      --text:     #e8ecf6;
      --text-dim: #a7b0c8;
      --muted:    #646f92;
      --primary:  #6366f1;
      --radius:   14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Star background ─────────────────────────────────── */
    #stars {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.45; }
    }

    /* Subtle radial glow behind the card */
    body::after {
      content: '';
      position: fixed;
      right: 18%;
      top: 50%;
      transform: translateY(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Top bar ─────────────────────────────────────────── */
    .top-bar {
      position: fixed; top: 0; left: 0;
      padding: 24px 40px;
      display: flex; align-items: center; gap: 12px;
      z-index: 10;
    }
    .brand-logo {
      width: 38px; height: 38px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 17px; font-weight: 600; color: var(--text);
    }

    /* ── Main layout ─────────────────────────────────────── */
    .layout {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 80px 80px 60px;
      position: relative;
      z-index: 1;
    }

    /* ── Left side ───────────────────────────────────────── */
    .left-side {
      flex: 1;
      max-width: 500px;
      padding-right: 40px;
    }
    .left-side h1 {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.22;
      margin-bottom: 20px;
      background: linear-gradient(140deg, #e8ecf6 20%, #8b97c8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .left-side p {
      font-size: 15px;
      color: var(--text-dim);
      line-height: 1.75;
      max-width: 380px;
    }

    /* ── Login card ──────────────────────────────────────── */
    .card {
      width: 420px;
      flex-shrink: 0;
      background: rgba(13, 21, 48, 0.85);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .card h2 {
      font-size: 27px; font-weight: 700;
      margin-bottom: 8px;
    }
    .card-sub {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* ── Form fields ─────────────────────────────────────── */
    .field { margin-bottom: 16px; }
    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
    }
    .field-row label { margin-bottom: 0; }
    .forgot {
      font-size: 13px; color: var(--text-dim);
      text-decoration: none;
      transition: color .15s;
    }
    .forgot:hover { color: var(--text); }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(30, 42, 74, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary);
      background: rgba(40, 55, 96, 0.6);
    }

    /* ── Remember checkbox ───────────────────────────────── */
    .remember {
      display: flex; align-items: center; gap: 10px;
      margin: 20px 0 24px;
      font-size: 14px; color: var(--text-dim);
      cursor: pointer;
    }
    .remember input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .remember label { cursor: pointer; margin: 0; }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn-login {
      width: 100%;
      padding: 13.5px;
      background: #fff;
      color: #050815;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .15s;
    }
    .btn-login:hover:not(:disabled) { opacity: .88; }
    .btn-login:disabled { opacity: .5; cursor: default; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background .15s, border-color .15s;
    }
    .btn-google:hover {
      background: rgba(30, 42, 74, 0.6);
      border-color: var(--border-hi);
    }

    /* ── Signup link ─────────────────────────────────────── */
    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-dim);
    }
    .signup-link a {
      color: var(--text); font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }
    .signup-link a:hover { text-decoration: underline; }

    /* ── Error / info message ────────────────────────────── */
    .msg {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .msg.error {
      background: rgba(244,63,94,.12);
      border: 1px solid rgba(244,63,94,.35);
      color: #fb7185;
    }
    .msg.info {
      background: rgba(99,102,241,.12);
      border: 1px solid rgba(99,102,241,.35);
      color: #818cf8;
    }

    /* ── Footer ──────────────────────────────────────────── */
    .footer {
      position: fixed; bottom: 24px; left: 40px;
      font-size: 13px; color: var(--muted);
      z-index: 10;
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 900px) {
      .layout { flex-direction: column; align-items: center; padding: 100px 24px 60px; }
      .left-side { max-width: 100%; padding: 0 0 40px; text-align: center; }
      .left-side h1 { font-size: 32px; }
      .left-side p { margin: 0 auto; }
      .card { width: 100%; max-width: 420px; }
    }
  </style>
</head>
<body>
  <div id="stars"></div>

  <div class="top-bar">
    <div class="brand-logo">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 7.5C6 5.567 7.567 4 9.5 4H12a3.5 3.5 0 0 1 0 7H10A3.5 3.5 0 0 0 10 18h2.5c1.933 0 3.5-1.567 3.5-3.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-name">Synchro Capital</div>
  </div>

  <div class="layout">
    <div class="left-side">
      <h1>讓資本決策更清<br>晰、可追溯。</h1>
      <p>使用 Supabase 驗證登入，管理您的工作區並維持可稽核的工作階段。</p>
    </div>

    <div class="card">
      <h2>歡迎回來</h2>
      <p class="card-sub">輸入帳號密碼以繼續。</p>

      <div class="msg" id="msg"></div>

      <div class="field">
        <label for="email">電子郵件</label>
        <input type="email" id="email" autocomplete="email" />
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password">密碼</label>
          <a href="#" class="forgot" onclick="doForgot(event)">忘記密碼？</a>
        </div>
        <input type="password" id="password" autocomplete="current-password" />
      </div>

      <div class="remember">
        <input type="checkbox" id="remember" checked />
        <label for="remember">在此裝置上保持登入</label>
      </div>

      <button class="btn-login" id="login-btn" onclick="doLogin()">
        登入 →
      </button>

      <div class="divider">或</div>

      <button class="btn-google" onclick="doGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z" fill="#4285F4"/><path d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.02c-.72.48-1.64.76-2.7.76-2.08 0-3.84-1.4-4.47-3.29H1.88v2.08A8 8 0 0 0 8.98 17z" fill="#34A853"/><path d="M4.51 10.52A4.8 4.8 0 0 1 4.26 9c0-.53.09-1.04.25-1.52V5.4H1.88A8 8 0 0 0 .98 9c0 1.29.31 2.51.9 3.6l2.63-2.08z" fill="#FBBC05"/><path d="M8.98 3.58c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 8.98 1a8 8 0 0 0-7.1 4.4L4.5 7.48C5.15 5.6 6.9 3.58 8.98 3.58z" fill="#EA4335"/></svg>
        使用 Google 繼續
      </button>

      <div class="signup-link">
        還沒有帳戶？ <a onclick="doSignup()">註冊</a>
      </div>
    </div>
  </div>

  <div class="footer">© 2026 Synchro Capital</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── Stars ──────────────────────────────────────────────
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const sz = Math.random() * 1.8 + 0.6;
      s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*5}s;--delay:-${Math.random()*5}s`;
      starsEl.appendChild(s);
    }

    // ── Supabase ───────────────────────────────────────────
    const { createClient } = supabase;
    const _sup = createClient(
      'https://rsfgfdcnvqjtlinorfno.supabase.co',
      'sb_publishable_DXlyR51b5xWfx2wcpLvVbg_3ukRYyjf'
    );

    // Already logged in → skip to app
    _sup.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/';
    });

    // ── Helpers ────────────────────────────────────────────
    function showMsg(text, type = 'error') {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `msg ${type}`;
      el.style.display = 'block';
    }
    function setLoading(on) {
      const btn = document.getElementById('login-btn');
      btn.disabled = on;
      btn.textContent = on ? '登入中…' : '登入 →';
    }

    // ── Actions ────────────────────────────────────────────
    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showMsg('請輸入電子郵件與密碼'); return; }
      setLoading(true);
      const { error } = await _sup.auth.signInWithPassword({ email, password });
      if (error) { showMsg(error.message); setLoading(false); }
      else window.location.href = '/';
    }

    async function doGoogle() {
      const { error } = await _sup.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/' }
      });
      if (error) showMsg(error.message);
    }

    async function doForgot(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { showMsg('請先輸入電子郵件'); return; }
      const { error } = await _sup.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/'
      });
      if (error) showMsg(error.message);
      else showMsg('重設密碼郵件已寄出，請檢查信箱。', 'info');
    }

    async function doSignup() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showMsg('請輸入電子郵件與密碼'); return; }
      const { error } = await _sup.auth.signUp({ email, password });
      if (error) showMsg(error.message);
      else showMsg('確認郵件已寄出，請檢查信箱。', 'info');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
