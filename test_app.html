<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta http-equiv="Cache-Control" content="no-cache"><meta http-equiv="Expires" content="0"><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><meta http-equiv="PRAGMA" content="NO-CACHE"><meta name="theme-color" content="#607D8B"><link rel="icon" type="image/png" href="https://b2bfundrwd.moneydj.com/favicon.ico"><title>嘉實資訊 - 盤後資訊</title><style type="text/css">*{box-sizing:border-box}#entry-animate{pointer-events:none;overflow:hidden;background-color:#f6fcff;position:fixed;width:100%;height:100%;z-index:9999;transition:1s opacity;-ms-transform:rotate(0);-webkit-transform:rotate(0);transform:rotate(0)}#entry-animate #combinedshape,#entry-animate #combinedshape1{pointer-events:none;background:url(/b2brwd/page/images/portal/trend.svg);background-color:rgba(255,255,255,0);bottom:0;height:293px;position:absolute;-ms-transform:rotate(0);-webkit-transform:rotate(0);transform:rotate(0);opacity:.6;background-repeat:repeat-x}#entry-animate #combinedshape{left:0}</style></head><body><div id="entry-animate"><div id="combinedshape"></div></div><script>(function () {
        var svgWidth = 375;
        var repeat = Math.ceil(window.innerWidth / svgWidth);
        var w = repeat * svgWidth;
        var dom = document.getElementById('combinedshape');
        var durationRate = 5 / 375;
        var duration = durationRate * window.innerWidth;
        var resizeFlag = 0;

        window.addEventListener('resize', function () {
          clearTimeout(resizeFlag);
          resizeFlag = setTimeout(function () {
            w = svgWidth * Math.ceil(window.innerWidth / svgWidth);
            duration = durationRate * window.innerWidth;
          }, 500);
        });

        function objectStyle(o) {
          return JSON.stringify(o)
            .replace(/,/g, ';')
            .replace(/["|{|}]/g, '');
        }

        function transitionStart() {
          var style = objectStyle({ left: 0, width: w * 2 + 'px', transition: 'left ' + duration + 's linear 0.0s' });

          dom.setAttribute('style', style);
          dom.addEventListener('transitionend', transitionEnd);
        }

        function transitionEnd() {
          dom.removeEventListener('transitionend', transitionEnd);
          dom.setAttribute('style', objectStyle({ left: 0 - w + 'px', width: w * 2 + 'px' }));

          setTimeout(function () {
            transitionStart();
          }, 0);
        }

        transitionEnd();
      })();</script><div id="app"></div><div id="global-division"></div><script src="/b2brwd/page/js/bundle.56264276.js?a=1"></script></body></html>
